services:
  db:
    image: postgres:16-alpine
    container_name: deskops-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: deskops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: deskops-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/deskops?schema=public
      JWT_SECRET: local-development-secret-change-this
      CLIENT_URL: http://localhost:5173
    depends_on:
      - db

volumes:
  postgres_data: